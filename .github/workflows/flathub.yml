name: Update Flathub manifest on release

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      release-url:
        required: true
        type: string
    secrets:
      FLATHUB_PAT:
        required: true

jobs:
  update-flathub:
    name: "Open PR to Flathub"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app source at release commit
        uses: actions/checkout@v4
        with:
          path: source
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          fetch-depth: 0

      - name: Resolve release commit SHA
        id: release_sha
        working-directory: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Checkout Flathub manifest repo
        uses: actions/checkout@v4
        with:
          repository: flathub/dev.edfloreshz.Tasks
          path: flathub
          token: ${{ secrets.FLATHUB_PAT }}

      - name: Install flatpak-cargo-generator deps
        run: pip3 install aiohttp tomlkit

      - name: Generate cargo-sources.json
        working-directory: source
        run: |
          mkdir -p flatpak
          curl -Lo flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock -o flatpak/cargo-sources.json

      - name: Copy cargo-sources.json into Flathub repo
        run: cp source/flatpak/cargo-sources.json flathub/cargo-sources.json

      - name: Update manifest for the release
        working-directory: flathub
        env:
          RELEASE_COMMIT: ${{ steps.release_sha.outputs.sha }}
        run: |
          MANIFEST="dev.edfloreshz.Tasks.json"

          assets=res
          desktop="${MANIFEST%.json}.desktop"
          metainfo="${MANIFEST%.json}.metainfo.xml"
          icon="${MANIFEST%.json}.svg"
          if [[ -d ../source/resources ]]; then
            assets=resources
          fi
          if [[ -f ../source/resources/app.desktop ]]; then
            desktop=app.desktop
            metainfo=app.metainfo.xml
            icon=icon.svg
          fi

          metadata_dir="$assets"
          if [[ -f ../source/build.rs ]] && grep -q 'xdgen' ../source/build.rs; then
            metadata_dir=target/xdgen
          fi

          jq --arg commit "$RELEASE_COMMIT" \
             --arg desktop "$metadata_dir/$desktop" \
             --arg metainfo "$metadata_dir/$metainfo" \
             --arg icon "$assets/icons/hicolor/scalable/apps/$icon" \
             '(.modules[] | select(.name == "tasks") | .sources) |=
               map(
                 if type == "object" and .type == "git" then
                   .commit = $commit
                 else . end
               )
           | (.modules[] | select(.name == "tasks") | .["build-commands"][]?) |=
               gsub("(?<![[:alnum:]_./-])(?<relative>\\./)?(?:res|resources|target/xdgen)/(?<path>(?:app|dev\\.edfloreshz\\.Tasks)\\.(?:desktop|metainfo\\.xml)|icons/hicolor/scalable/apps/(?:icon|dev\\.edfloreshz\\.Tasks)\\.svg)";
                 (.relative // "") +
                 (if (.path | endswith(".desktop")) then $desktop
                  elif (.path | endswith(".xml")) then $metainfo
                  else $icon end))
             ' "$MANIFEST" > "$MANIFEST.tmp"
          mv "$MANIFEST.tmp" "$MANIFEST"

      - name: Open PR to Flathub
        uses: peter-evans/create-pull-request@v7
        with:
          path: flathub
          token: ${{ secrets.FLATHUB_PAT }}
          commit-message: "Update to ${{ inputs.tag || github.event.release.tag_name }}"
          title: "Update to ${{ inputs.tag || github.event.release.tag_name }}"
          body: "Automated update from release ${{ inputs.release-url || github.event.release.html_url }}"
          branch: "update-${{ inputs.tag || github.event.release.tag_name }}"
