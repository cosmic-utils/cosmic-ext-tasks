<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Task manager clipboard</title>
  <defs>
    <linearGradient id="board" x1="0%" y1="0%" x2="35%" y2="100%">
      <stop stop-color="#BE9464"/>
      <stop offset="1" stop-color="#855E39"/>
    </linearGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop stop-color="#FFFCF4"/>
      <stop offset="1" stop-color="#ECE3D5"/>
    </linearGradient>
    <linearGradient id="clip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop stop-color="#DCE1E4"/>
      <stop offset=".34" stop-color="#CDD3D7"/>
      <stop offset=".8" stop-color="#ADB6BC"/>
      <stop offset="1" stop-color="#929DA5"/>
    </linearGradient>
    <linearGradient id="checkbox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop stop-color="#A16C40"/>
      <stop offset="1" stop-color="#754724"/>
    </linearGradient>
  </defs>

  <!-- Clipboard and sheet -->
  <rect x="18" y="20" width="92" height="96" rx="13" fill="url(#board)"/>
  <rect x="26" y="28" width="76" height="80" rx="7" fill="url(#paper)"/>

  <!-- Spring clip -->
  <path d="M47 15h6a11 11 0 0 1 22 0h6a5 5 0 0 1 5 5v12a4 4 0 0 1-4 4H46a4 4 0 0 1-4-4V20a5 5 0 0 1 5-5Z"
        fill="url(#clip)"/>
  <circle cx="64" cy="15" r="3.5" fill="#67727E"/>

  <!-- Completed and pending tasks -->
  <rect x="34" y="43" width="26" height="26" rx="6" fill="url(#checkbox)"/>
  <path d="m40.5 56 4.5 4.5L54 53.5" fill="none" stroke="#FAFFF9"
        stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="36" y="77" width="22" height="22" rx="4" fill="none" stroke="#68665D" stroke-width="4"/>
  <path d="M69 56h21m-21 32h15" fill="none" stroke="#625F56" stroke-width="5.5" stroke-linecap="round"/>
</svg>
